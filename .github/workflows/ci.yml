name: CI

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.os }} / ${{ matrix.tier }})
    if: matrix.tier == 'full' || !startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            tier: full
          - os: windows-2022
            tier: smoke

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.tier }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.tier }}-
            ${{ runner.os }}-cargo-

      - name: Build all targets (debug)
        if: matrix.tier == 'full'
        run: cargo build --workspace --all-targets --verbose --locked

      - name: Run tests (all targets, debug)
        if: matrix.tier == 'full'
        run: cargo test --workspace --all-targets --verbose --locked

      - name: Compile smoke check (all targets, debug)
        if: matrix.tier == 'smoke'
        run: cargo check --workspace --all-targets --verbose --locked

      - name: Release-profile smoke check (all targets)
        run: cargo check --workspace --all-targets --release --verbose --locked

      - name: Check formatting
        if: matrix.tier == 'full'
        run: cargo fmt --all -- --check

      - name: Run clippy (all targets)
        if: matrix.tier == 'full'
        run: cargo clippy --workspace --all-targets -- -D warnings

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Build release binaries
        run: cargo build --release --all

      - name: Create release archive
        run: |
          mkdir release
          cp target/release/openniri.exe release/
          cp target/release/openniri-cli.exe release/
          cp README.md release/
          cp LICENSE* release/ 2>$null; $true
          Compress-Archive -Path release/* -DestinationPath openniri-windows-${{ github.ref_name }}.zip
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            openniri-windows-${{ github.ref_name }}.zip
            target/release/openniri.exe
            target/release/openniri-cli.exe
          generate_release_notes: true
